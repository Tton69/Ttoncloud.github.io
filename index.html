<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тton – неоновый логотип</title>

<!-- Фавикон -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  body{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }

  @keyframes pulse{
    0%   {filter: drop-shadow(0 0 6px #D400FF) drop-shadow(0 0 12px #D400FF);}
    50%  {filter: drop-shadow(0 0 12px #D400FF) drop-shadow(0 0 20px #5B0E9A);}
    100% {filter: drop-shadow(0 0 6px #D400FF) drop-shadow(0 0 12px #D400FF);}
  }

  #tton-logo{
    animation:pulse 3s infinite ease-in-out;
    transition:transform .3s;
  }
  #tton-logo:hover{
    transform:scale(1.08);
  }
</style>
</head>

<body>

<svg id="tton-logo"
     width="200" height="200"
     viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Логотип Tton</title>
  <desc id="desc">Неоновая буква T в чёрно‑фиолетовом градиенте с эффектом свечения</desc>
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D400FF"/>
      <stop offset="100%" stop-color="#5B0E9A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outline" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="1"/>
      <feFlood flood-color="#000000" flood-opacity="0.9"/>
      <feComposite in2="DILATED" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
      .t-font{font-family:'Orbitron',Arial,Helvetica,sans-serif;font-weight:900;}
    ]]></style>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        class="t-font" font-size="140"
        fill="url(#neonGrad)"
        filter="url(#outline) url(#glow)">
    T
  </text>
</svg>

</body>
</html>
