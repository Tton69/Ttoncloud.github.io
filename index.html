<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tton Cloud – соц‑сети</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ★ ФАВИКОН ★ -->
<link rel="icon" href="img/favicon.ico" type="image/x-icon">

<style>
/* -------------------------------------------------
   Общие стили страницы
   ------------------------------------------------- */
html,body{
  margin:0;padding:0;height:100%;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  background:#111;
  background:linear-gradient(225deg,#111 0%,#1a0c2c 40%,#0e0349 60%,#111 100%);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
h1{
  color:#fff;
  font-size:1.8rem;
  margin:0 0 0.4rem 0;
  letter-spacing:0.02em;
}
.logo{width:240px;height:auto;margin:0.5rem 0 1rem 0}
.links{
  display:flex;
  flex-direction:column;
  gap:0.8rem;
  align-items:center;
  width:100%;
  max-width:320px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.6rem 1rem;
  border-radius:0.9rem;
  background:#222;
  color:#9b5bff;
  text-decoration:none;
  font-size:1rem;
  transition:background .2s,color .2s;
}
.btn:hover{background:#333;color:#cfa6ff}
svg.icon{
  width:1.2em;
  height:1.2em;
  fill:currentColor;
}
footer{margin-top:2rem;font-size:0.85rem;color:#777}

/* -------------------------------------------------
   SVG‑анимации логотипа
   ------------------------------------------------- */
.cloud{fill:url(#gradMain);filter:url(#glow);animation:float 4s ease-in-out infinite}
.inner{fill:url(#gradInner);filter:url(#glowInner);animation:float 5s ease-in-out infinite alternate}
.highlight{fill:url(#gradHighlight);pointer-events:none}
.spark{fill:#fff;opacity:.2;animation:spark 2s linear infinite}
.rain{stroke:#9b5bff;stroke-width:2;stroke-linecap:round;opacity:.4}
@keyframes float{
  0%   {transform:translateY(0)   scale(1);}
  50%  {transform:translateY(-12px)scale(1.03);}
  100% {transform:translateY(0)   scale(1);}
}
@keyframes spark{
  0%   {opacity:.2;transform:scale(.8);}
  50%  {opacity:.6;transform:scale(1.2);}
  100% {opacity:.2;transform:scale(.8);}
}
</style>
</head>
<body>

<h1>All worlds in one page</h1>

<div class="logo">
<svg width="240" height="240" viewBox="0 0 240 240"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Purple Cloud</title>
  <desc id="logoDesc">Ассиметричное фиолетовое облако с деталями и анимацией.</desc>

  <defs>
    <!-- Градиенты -->
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#9b5bff"/>
      <stop offset="100%" stop-color="#4a0e9a"/>
    </linearGradient>
    <linearGradient id="gradInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="gradHighlight" cx="50%" cy="35%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Фильтры -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowInner" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Декоративные звёздочки -->
    <circle id="star" class="spark" cx="0" cy="0" r="2"/>

    <!-- Капли‑дождик -->
    <path id="drop" class="rain" d="M0 0 L0 8"/>
  </defs>

  <!-- Внутренний слой -->
  <path class="inner"
        d="M35,140 c-12,-30 10,-70 55,-55 a20,20 0 0 1 30,-8 c35,-15 70,20 55,55 q-8,12 -25,12 h-90 c-15,0 -20,-12 -20,-12z"/>

  <!-- Основное облако -->
  <path class="cloud"
        d="M30,150 c-15,-35 20,-80 70,-55 a25,30 0 0 1 40,-10 c45,-20 85,30 60,70 q-10,15 -30,15 h-115 c-20,0 -25,-20 -25,-25z"/>

  <!-- Блик -->
  <ellipse class="highlight" cx="85" cy="95" rx="70" ry="40"/>

  <!-- Звёздочки -->
  <use href="#star" x="55"  y="115"/>
  <use href="#star" x="130" y="130"/>
  <use href="#star" x="180" y="100"/>
  <use href="#star" x="95"  y="150"/>
  <use href="#star" x="150" y="70"/>

  <!-- Дождик -->
  <use href="#drop" x="80"  y="160" transform="rotate(10 80 160)"/>
  <use href="#drop" x="115" y="165" transform="rotate(-8 115 165)"/>
  <use href="#drop" x="140" y="158" transform="rotate(5 140 158)"/>

  <!-- Яркие искры -->
  <circle class="spark" cx="70"  cy="130" r="2"/>
  <circle class="spark" cx="110" cy="115" r="2"/>
  <circle class="spark" cx="150" cy="140" r="2"/>
  <circle class="spark" cx="120" cy="160" r="2"/>
</svg>
</div>
