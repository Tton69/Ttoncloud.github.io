<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tton Cloud - online hubs</title>

    <meta name="description"
          content="Tton‑Cloud – a single page with links to my GitHub, Telegram, Steam and other profiles. One click, the right platform.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="https://avatars.githubusercontent.com/u/115378942?s=200">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">

    <script src="https://kit.fontawesome.com/0c6f8228e2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons.css"/>

    <style>

        :root {
            --bg-color: #0e1117;
            --card-bg: #1a1e27;
            --accent: #00c8ff;
            --text: #e0e5eb;
            --radius: 12px;
            --gap: 1.5rem;
        }

        *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: var(--gap);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,.4);
        }

        .logo   { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: .5rem; }
        .subtitle { font-size: 1rem; opacity: .8; margin-bottom: 2rem; }

        .links {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            margin-top: 1rem;
        }
        .link {
            display: flex;
            align-items: center;
            gap: .8rem;
            background: var(--bg-color);
            border-radius: var(--radius);
            padding: .8rem 1rem;
            transition: background .2s, transform .2s;
        }
        .link:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
        .link i { font-size: 1.4rem; width: 1.6rem; }
        .link span { font-weight: 500; flex-grow: 1; text-align: left; }

        @media (max-width: 420px) {
            .card { padding: 1.5rem; }
        }
    </style>
</head>

<body>
    <section class="card">

        <div class="logo">Tton‑Cloud</div>
        <p class="subtitle">all my worlds in one place</p>

        <div class="links">
         
            <a class="link" href="https://github.com/Tton69" target="_blank" rel="noopener">
                <i class="si si-github"></i>
                <span>GitHub</span>
                <i class="fas fa-arrow-up-right-from-square"></i>
            </a>
         
            <a class="link" href="https://t.me/Tton699" target="_blank" rel="noopener">
                <i class="si si-telegram"></i>
                <span>Telegram</span>
                <i class="fas fa-arrow-up-right-from-square"></i>
            </a>

            <a class="link" href="https://steamcommunity.com/profiles/76561199824818652/" target="_blank"
               rel="noopener">
                <i class="si si-steam"></i>
                <span>Steam</span>
                <i class="fas fa-arrow-up-right-from-square"></i>
            </a>
        </div>
    </section>
</body>
</html>
