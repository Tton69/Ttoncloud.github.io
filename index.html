html,body{
  margin:0;padding:0;height:100%;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  background:#111;
  background:linear-gradient(225deg,#111 0%,#1a0c2c 40%,#0e0349 60%,#111 100%);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
h1{
  color:#fff;
  font-size:1.8rem;
  margin:0 0 0.4rem 0;
  letter-spacing:0.02em;
}

.btn{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.6rem 1rem;border-radius:0.9rem;
  background:#222;color:#9b5bff;text-decoration:none;
  font-size:1rem;transition:background .2s,color .2s;
}
.btn:hover{background:#333;color:#cfa6ff}
svg.icon{width:1.2em;height:1.2em;fill:currentColor}
footer{margin-top:2rem;font-size:0.85rem;color:#777}

<div class="logo">
<svg width="240" height="240" viewBox="0 0 240 240"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Purple Cloud</title>
  <desc id="logoDesc">Ассиметричное фиолетовое облако с небольшими деталями и анимацией.</desc>
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b5bff"/>
      <stop offset="100%" stop-color="#4a0e9a"/>
    </linearGradient>
    <radialGradient id="gradHighlight" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style type="text/css"><![CDATA[
      .cloud{fill:url(#gradMain);filter:url(#glow);animation:float 4s ease-in-out infinite}
      .highlight{fill:url(#gradHighlight);pointer-events:none}
      .spark{fill:#fff;opacity:.3;animation:spark 2s linear infinite}
      @keyframes float{0%{transform:translateY(0)scale(1)}50%{transform:translateY(-12px)scale(1.03)}100%{transform:translateY(0)scale(1)}}
      @keyframes spark{0%{opacity:.2;transform:scale(.8)}50%{opacity:.5;transform:scale(1.2)}100%{opacity:.2;transform:scale(.8)}}
    ]]></style>
  </defs>
  <path class="cloud" d="M30,150c-15,-35 20,-80 70,-55a25,30 0 0 1 40,-10c45,-20 85,30 60,70q-10,15 -30,15h-115c-20,0 -25,-20 -25,-25z"/>

  <circle class="spark" cx="110" cy="115" r="2"/>
  <circle class="spark" cx="150" cy="140" r="2"/>
