<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tton Cloud – соц‑сети</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ---------- Общие стили ---------- */
        html,body{
            margin:0;
            padding:0;
            height:100%;
            font-family:Arial,Helvetica,sans-serif;
            background:#111;                /* почти чёрный фон */
            color:#eee;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
        }

        a{
            color:#9b5bff;
            text-decoration:none;
            font-size:1.2rem;
            margin:0.3rem 0;
            display:inline-block;
            transition:color .2s;
        }
        a:hover{
            color:#cfa6ff;
        }

        .logo{
            width:240px;
            height:auto;
            margin-bottom:1.5rem;
        }
        .links{
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        footer{
            margin-top:2rem;
            font-size:0.85rem;
            color:#777;
        }
    </style>
</head>
<body>

    <!-- ==================== LOGO ==================== -->
    <div class="logo">
        <svg width="240" height="240" viewBox="0 0 240 240"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-labelledby="logoTitle logoDesc">
            <title id="logoTitle">Purple Cloud</title>
            <desc id="logoDesc">Ассиметричное фиолетовое облако с небольшими деталями и анимацией.</desc>
            <defs>
                <linearGradient id="gradMain" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#9b5bff"/>
                    <stop offset="100%" stop-color="#4a0e9a"/>
                </linearGradient>
                <radialGradient id="gradHighlight" cx="50%" cy="35%" r="50%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <style type="text/css"><![CDATA[
                    .cloud{
                        fill:url(#gradMain);
                        filter:url(#glow);
                        animation:float 4s ease-in-out infinite;
                    }
                    .highlight{
                        fill:url(#gradHighlight);
                        pointer-events:none;
                    }
                    .spark{
                        fill:#fff;
                        opacity:.3;
                        animation:spark 2s linear infinite;
                    }
                    @keyframes float{
                        0%   {transform:translateY(0) scale(1);}
                        50%  {transform:translateY(-12px) scale(1.03);}
                        100% {transform:translateY(0) scale(1);}
                    }
                    @keyframes spark{
                        0%   {opacity:.2; transform:scale(.8);}
                        50%  {opacity:.5; transform:scale(1.2);}
                        100% {opacity:.2; transform:scale(.8);}
                    }
                ]]></style>
            </defs>

            <!-- Облако -->
            <path class="cloud"
                  d="M30,150 c-15,-35 20,-80 70,-55 a25,30 0 0 1 40,-10
                     c45,-20 85,30 60,70 q-10,15 -30,15 h-115
                     c-20,0 -25,-20 -25,-25 z"/>

            <!-- Блик -->
            <ellipse class="highlight" cx="85" cy="95" rx="70" ry="40"/>

            <!-- Искры -->
            <circle class="spark" cx="70"  cy="130" r="2"/>
            <circle class="spark" cx="110" cy="115" r="2"/>
            <circle class="spark" cx="150" cy="140" r="2"/>
            <circle class="spark" cx="120" cy="160" r="2"/>
        </svg>
    </div>

    <!-- ==================== ССЫЛКИ ==================== -->
    <nav class="links">

        </a>

    </nav>

    </footer>

</body>
</html>
